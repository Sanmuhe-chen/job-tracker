var LS_PREFIX = 'job_applied_';
function getApplied(id){ return localStorage.getItem(LS_PREFIX+id) === '1'; }
function setApplied(id, v){ localStorage.setItem(LS_PREFIX+id, v?'1':'0'); render(); schedulePush(); }

function todayStr(){
  var d = new Date();
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
}
function diffDays(deadline){
  var t = new Date(todayStr()).getTime(), d = new Date(deadline).getTime();
  return Math.round((d - t) / 86400000);
}
function dlClass(dl){
  if(!dl) return '';
  var n = diffDays(dl);
  if(n < 0) return 'over';
  if(n === 0) return 'today';
  if(n <= 3) return 'soon';
  return '';
}
function dlText(dl){
  if(!dl) return '未注明';
  var n = diffDays(dl);
  if(n < 0) return dl + '（已截止）';
  if(n === 0) return dl + '（今天截止）';
  return dl + '（剩'+n+'天）';
}

function filtered(){
  var kw = document.getElementById('kw').value.trim().toLowerCase();
  var cat = document.getElementById('fCat').value;
  var st = document.getElementById('fStatus').value;
  var sort = document.getElementById('fSort').value;
  var arr = JOBS.filter(function(j){
    if(cat && j.category !== cat) return false;
    if(st === 'applied' && !getApplied(j.id)) return false;
    if(st === 'open' && getApplied(j.id)) return false;
    if(kw){
      var hay = (j.company + ' ' + j.position + ' ' + j.location + ' ' + (j.note||'')).toLowerCase();
      if(hay.indexOf(kw) < 0) return false;
    }
    return true;
  });
  arr.sort(function(a,b){
    if(sort === 'deadline'){
      var da = a.deadline||'9999', db = b.deadline||'9999';
      return da < db ? -1 : da > db ? 1 : b.publish.localeCompare(a.publish);
    }
    return b.publish.localeCompare(a.publish);
  });
  return arr;
}

function render(){
  var arr = filtered();
  var tbody = document.getElementById('tbody');
  var html = '';
  arr.forEach(function(j){
    var applied = getApplied(j.id);
    var dlCls = dlClass(j.deadline);
    html += '<tr class="'+(applied?'applied-row':'')+'">'
      + '<td><input type="checkbox" '+(applied?'checked':'')+' onclick="setApplied('+j.id+', this.checked)"></td>'
      + '<td><b>'+j.company+'</b>'+(j.note?'<br><span style="font-size:11px;color:#6B7280">'+j.note+'</span>':'')+'</td>'
      + '<td class="pos">'+j.position+'</td>'
      + '<td><span class="cat cat-'+j.category+'">'+j.category+'</span></td>'
      + '<td>'+j.location+'</td>'
      + '<td>'+j.salary+'</td>'
      + '<td style="white-space:nowrap">'+j.publish+'</td>'
      + '<td class="dl '+dlCls+'">'+dlText(j.deadline)+'</td>'
      + '<td><a class="link" href="'+j.url+'" target="_blank" rel="noopener">查看原文 ↗</a></td>'
      + '</tr>';
  });
  tbody.innerHTML = html;
  document.getElementById('empty').style.display = arr.length ? 'none' : 'block';
  document.getElementById('cnt').textContent = arr.length;

  var total = JOBS.length, appliedN = 0, urgentN = 0;
  JOBS.forEach(function(j){
    if(getApplied(j.id)) appliedN++;
    if(j.deadline){ var n = diffDays(j.deadline); if(n >= 0 && n <= 3) urgentN++; }
  });
  document.getElementById('stTotal').textContent = total;
  document.getElementById('stApplied').textContent = appliedN;
  document.getElementById('stOpen').textContent = total - appliedN;
  document.getElementById('stUrgent').textContent = urgentN;
}

function exportCSV(){
  var rows = [['已投','公司','岗位','类别','地点','薪资','发布日期','截止日期','原文链接']];
  JOBS.forEach(function(j){
    rows.push([getApplied(j.id)?'是':'否', j.company, j.position, j.category, j.location, j.salary, j.publish, j.deadline||'', j.url]);
  });
  var csv = '\ufeff' + rows.map(function(r){ return r.map(function(c){ return '"'+String(c).replace(/"/g,'""')+'"'; }).join(','); }).join('\n');
  var a = document.createElement('a');
  a.href = 'data:text/csv;charset=utf-8,' + encodeURIComponent(csv);
  a.download = '求职岗位跟踪表_'+todayStr()+'.csv';
  a.click();
}
function resetApplied(){
  if(!confirm('确认清空所有已投勾选？')) return;
  JOBS.forEach(function(j){ localStorage.removeItem(LS_PREFIX+j.id); });
  render(); schedulePush();
}

/* ---- 云端同步：已投状态实时存到 GitHub 仓库 applied.json，跨浏览器自动恢复 ---- */
var SYNC = { owner:'Sanmuhe-chen', repo:'job-tracker', path:'applied.json', token:null, sha:null, timer:null };
function ghApi(method, body){
  var url = 'https://api.github.com/repos/' + SYNC.owner + '/' + SYNC.repo + '/contents/' + SYNC.path;
  var opt = { method: method, headers: { 'Accept': 'application/vnd.github+json' } };
  if(SYNC.token) opt.headers['Authorization'] = 'Bearer ' + SYNC.token;
  if(body){ opt.headers['Content-Type'] = 'application/json'; opt.body = JSON.stringify(body); }
  return fetch(url, opt).then(function(r){
    if(!r.ok) return r.json().then(function(e){ throw new Error((e && e.message) || r.status); });
    return r.json();
  });
}
function getCloud(){
  return ghApi('GET').then(function(d){
    SYNC.sha = d.sha;
    try{ return JSON.parse(atob(d.content)); }catch(e){ return null; }
  }).catch(function(e){
    if(String(e.message).indexOf('Not Found') >= 0){ SYNC.sha = null; return null; }
    throw e;
  });
}
function localMap(){
  var m = {};
  JOBS.forEach(function(j){ if(getApplied(j.id)) m[j.id] = true; });
  return m;
}
function applyToLocal(data){
  if(!data || !data.applied) return;
  var ids = {};
  JOBS.forEach(function(j){ ids[j.id] = true; });
  Object.keys(data.applied).forEach(function(k){
    var id = parseInt(k, 10);
    if(ids[id] && data.applied[k] === true) localStorage.setItem(LS_PREFIX+id, '1');
  });
}
function loadCloud(){
  getCloud().then(function(data){
    if(data){ applyToLocal(data); render(); }
  }).catch(function(){ /* 网络失败则保留本地勾选 */ });
}
function pushCloud(){
  SYNC.token = localStorage.getItem('gh_token');
  if(!SYNC.token){
    var t = prompt('云端同步需要 GitHub 访问令牌（把已投状态写入你的 job-tracker 仓库）。\n\n创建：GitHub → Settings → Developer settings → Personal access tokens → Fine-grained tokens → 仓库仅选 Sanmuhe-chen/job-tracker，权限只勾 Contents: Read and write。\n\n令牌只保存在当前浏览器，换浏览器后在此再粘贴一次即可，勾选记录会自动从云端恢复。');
    if(!t) return;
    SYNC.token = t.trim();
    localStorage.setItem('gh_token', SYNC.token);
  }
  var mine = localMap();
  getCloud().then(function(cloud){
    if(cloud && cloud.applied){ // 写前合并云端（其他浏览器勾选的保留），避免覆盖丢失
      var ids = {};
      JOBS.forEach(function(j){ ids[j.id] = true; });
      Object.keys(cloud.applied).forEach(function(k){
        var id = parseInt(k, 10);
        if(ids[id] && cloud.applied[k] === true && !mine[id]) mine[id] = true;
      });
      applyToLocal(cloud);
    }
    var payload = { message: 'sync applied ' + new Date().toISOString(), content: btoa(JSON.stringify({ version:1, applied: mine })) };
    if(SYNC.sha) payload.sha = SYNC.sha;
    return ghApi('PUT', payload);
  }).then(function(d){
    SYNC.sha = (d.content && d.content.sha) || null;
  }).catch(function(){
    if(SYNC.sha){ SYNC.sha = null; setTimeout(pushCloud, 800); } // sha 过期重试
  });
}
function schedulePush(){
  if(SYNC.timer) clearTimeout(SYNC.timer);
  SYNC.timer = setTimeout(pushCloud, 1500);
}
function cloudSync(){
  var t = prompt('输入 GitHub 访问令牌（可留空：仅从云端拉取已投状态，不写入）。\n令牌仅保存在当前浏览器 localStorage。');
  if(t && t.trim()){ SYNC.token = t.trim(); localStorage.setItem('gh_token', SYNC.token); }
  loadCloud();
  if(SYNC.token) pushCloud();
}

document.getElementById('kw').addEventListener('input', render);
document.getElementById('fCat').addEventListener('change', render);
document.getElementById('fStatus').addEventListener('change', render);
document.getElementById('fSort').addEventListener('change', render);

render();
loadCloud(); // 页面加载时从云端恢复已投状态（公开读取，无需令牌）
</script>
